name: CI Verification & Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify data, assets & links
        run: npm run verify

      - name: Browser for pre-rendering
        run: npx playwright install --with-deps chromium

      - name: TypeScript, production build & pre-render
        run: npm run build
