name: Sync CRCA Forms & Documents

on:
  schedule:
    # Weekly on Sunday at 16:00 UTC (Monday 2:00 AM AEST / 3:00 AM AEDT).
    # Change to '0 16 * * *' for daily syncing.
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync CRCA forms and documents
        run: npm run sync-docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for document updates
        id: changes
        run: |
          if [ -z "$(git status --porcelain public/documents/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in public/documents/."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify TypeScript and production build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push updated documents
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/documents/
          git commit -m "chore(docs): sync CRCA forms & documents from upstream"
          git push
