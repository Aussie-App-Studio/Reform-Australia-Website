# Builds and publishes the site to Cloudflare Pages on every push to main (secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
# At launch, set the repository variable SITE_INDEXING to "on" so search engines can index the site.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push (e.g. several quick edits in /admin) replaces a publish that is still running.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify
      # Phone-sized copies of any photos uploaded through /admin
      - run: npm run images
      - run: npx playwright install --with-deps chromium
      - name: Build and deploy
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_INDEXING: ${{ vars.SITE_INDEXING }}
