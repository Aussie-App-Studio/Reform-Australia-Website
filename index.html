    <script>
      // Deep-link restore for GitHub Pages sub-folder previews (see scripts/deploy-gh-pages-preview.mjs).
      (function () {
        var m = window.location.search.match(/[?&]__p=([^&]*)/);
        if (m) {
          var base = window.location.pathname.replace(/[^/]*$/, '');
          window.history.replaceState(null, '', base + decodeURIComponent(m[1]));
        }
      })();
    </script>
