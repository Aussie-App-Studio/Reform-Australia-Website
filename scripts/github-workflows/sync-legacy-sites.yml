name: Sync Safe Church & Word of Salvation

# Pulls new Safe Church pages/files and new Word of Salvation sermons from the
# legacy WordPress sites into public/ so the static site stays current.
# To enable: copy this file into .github/workflows/ (needs a token with the
# "workflow" scope, e.g. `gh auth refresh -s workflow`).

on:
  schedule:
    - cron: '30 16 * * 0' # weekly, Monday ~2:30 AM AEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run sync-safe-church
      - run: npm run sync-sermons
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain public/data/safe-church public/data/sermons)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: npm run verify && npm run build
      - if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data/safe-church public/data/sermons
          git commit -m "chore: sync Safe Church and Word of Salvation content"
          git push
